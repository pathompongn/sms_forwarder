name: Build SMS Forwarder APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Render launcher icons from SVG
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          declare -A SIZES=( [mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192 )
          for folder in "${!SIZES[@]}"; do
            size=${SIZES[$folder]}
            outdir="app/src/main/res/$folder"
            mkdir -p "$outdir"
            rsvg-convert -w "$size" -h "$size" icon_source.svg -o "$outdir/ic_launcher.png"
            cp "$outdir/ic_launcher.png" "$outdir/ic_launcher_round.png"
          done
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "Icons rendered from SVG successfully"

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
